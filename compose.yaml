name: pgtui
services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: pgtui-postgres:18.7
    environment:
      POSTGRES_USER: pgtui
      POSTGRES_DB: pgtui
      POSTGRES_PASSWORD: ${PGTUI_POSTGRES_PASSWORD:?Set PGTUI_POSTGRES_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgtui -d pgtui"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
