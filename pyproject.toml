[project]
name = "pgtui"
version = "0.1.0"
description = "A keyboard-first PostgreSQL and Cloudflare D1 terminal IDE with DuckDB for local Parquet"
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harry Giunta" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "duckdb==1.5.5",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "textual==8.2.7",
    "keyring==25.7.0",
]

[project.urls]
Repository = "https://github.com/harryvgiunta/pgtui"
Issues = "https://github.com/harryvgiunta/pgtui/issues"
Contributing = "https://github.com/harryvgiunta/pgtui/blob/main/CONTRIBUTING.md"

[project.scripts]
pgtui = "d8r.tui.app:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["d8r"]

[tool.pytest.ini_options]
testpaths = ["tests"]
